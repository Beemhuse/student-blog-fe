<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - My Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <!-- Dashboard Layout -->
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg">
      <div class="p-6">
        <h2 class="text-xl font-bold text-gray-800">Dashboard</h2>
      </div>
      <nav class="mt-6">
        <a href="#" class="block px-6 py-2 text-gray-700 hover:bg-gray-100">Posts</a>
        <a href="#" class="block px-6 py-2 text-gray-700 hover:bg-gray-100">Categories</a>
        <a href="#" class="block px-6 py-2 text-gray-700 hover:bg-gray-100">Users</a>
        <a href="#" class="block px-6 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
      <!-- Header -->
      <header class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Manage Posts</h1>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
          Create New Post
        </button>
      </header>

      <!-- Content Table -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Author</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <!-- Row 1 -->
            <tr>
              <td class="px-6 py-4 text-sm text-gray-800">Blog Post Title 1</td>
              <td class="px-6 py-4 text-sm text-gray-800">John Doe</td>
              <td class="px-6 py-4 text-sm text-gray-800">October 10, 2023</td>
              <td class="px-6 py-4 text-sm">
                <a href="#" class="text-blue-500 hover:text-blue-700">Edit</a>
                <a href="#" class="text-red-500 hover:text-red-700 ml-4">Delete</a>
              </td>
            </tr>
            <!-- Row 2 -->
            <tr>
              <td class="px-6 py-4 text-sm text-gray-800">Blog Post Title 2</td>
              <td class="px-6 py-4 text-sm text-gray-800">Jane Smith</td>
              <td class="px-6 py-4 text-sm text-gray-800">October 12, 2023</td>
              <td class="px-6 py-4 text-sm">
                <a href="#" class="text-blue-500 hover:text-blue-700">Edit</a>
                <a href="#" class="text-red-500 hover:text-red-700 ml-4">Delete</a>
              </td>
            </tr>
            <!-- Row 3 -->
            <tr>
              <td class="px-6 py-4 text-sm text-gray-800">Blog Post Title 3</td>
              <td class="px-6 py-4 text-sm text-gray-800">John Doe</td>
              <td class="px-6 py-4 text-sm text-gray-800">October 15, 2023</td>
              <td class="px-6 py-4 text-sm">
                <a href="#" class="text-blue-500 hover:text-blue-700">Edit</a>
                <a href="#" class="text-red-500 hover:text-red-700 ml-4">Delete</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
